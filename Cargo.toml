[package]
name = "restloop"
version = "0.1.0"
edition = "2024"
description = "A minimal agent loop: one model, one shell tool."
license = "Apache-2.0"
repository = "https://github.com/lhwzds/restloop"

[dependencies]
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
