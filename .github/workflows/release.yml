name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
      - shell: bash
        run: |
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp target/${{ matrix.target }}/release/restflow$ext restflow-${{ matrix.target }}$ext
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "" 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" restflow-${{ matrix.target }}$ext --clobber
        env:
          GH_TOKEN: ${{ github.token }}
