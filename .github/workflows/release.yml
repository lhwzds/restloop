name: release

# A v* tag builds the binaries, publishes the GitHub release with checksums, and
# updates the Homebrew formula and the npm package. Run it by hand for a dry run:
# it builds and computes the checksums but publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
      - shell: bash
        run: |
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          mkdir dist
          cp "target/${{ matrix.target }}/release/restloop$ext" "dist/restloop-${{ matrix.target }}$ext"
      - uses: actions/upload-artifact@v4
        with:
          name: restloop-${{ matrix.target }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          files=(restloop-*)
          sha256sum "${files[@]}" > SHA256SUMS
          for f in "${files[@]}"; do sha256sum "$f" > "$f.sha256"; done
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes ""

  homebrew:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/checkout@v4
        with:
          repository: lhwzds/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update the formula
        run: |
          v="${GITHUB_REF_NAME#v}"
          url="https://github.com/lhwzds/restloop/releases/download/v$v"
          sum() { awk -v f="$1" '$2 == f { print $1 }' dist/SHA256SUMS; }
          cat > tap/Formula/restloop.rb <<EOF
          class Restloop < Formula
            desc "Minimal coding-agent loop: it keeps working on your task so you can rest"
            homepage "https://github.com/lhwzds/restloop"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "$url/restloop-aarch64-apple-darwin"
                sha256 "$(sum restloop-aarch64-apple-darwin)"
              end
              on_intel do
                url "$url/restloop-x86_64-apple-darwin"
                sha256 "$(sum restloop-x86_64-apple-darwin)"
              end
            end

            on_linux do
              on_arm do
                url "$url/restloop-aarch64-unknown-linux-musl"
                sha256 "$(sum restloop-aarch64-unknown-linux-musl)"
              end
              on_intel do
                url "$url/restloop-x86_64-unknown-linux-musl"
                sha256 "$(sum restloop-x86_64-unknown-linux-musl)"
              end
            end

            def install
              bin.install Dir["restloop-*"].first => "restloop"
            end

            test do
              assert_match "usage: restloop", shell_output("#{bin}/restloop --help")
            end
          end
          EOF
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/restloop.rb
          git commit -m "Update restloop to $v"
          git push

  npm:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: node npm/stamp.js "${GITHUB_REF_NAME#v}" dist/SHA256SUMS
      # Trusted publishing: npmjs.com must list lhwzds/restloop, workflow release.yml.
      - run: npm publish --access public --provenance
        working-directory: npm
